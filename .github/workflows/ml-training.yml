name: Entraînement ML Top 3 + potentiel restant

on:
  workflow_dispatch:
  schedule:
    # Réentraînement hebdomadaire le dimanche soir, sans impact sur le trading.
    - cron: "0 18 * * 0"

permissions:
  contents: read

jobs:
  train-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances ML
        run: pip install --requirement requirements-ml.txt

      - name: Entraîner et valider le modèle Top 3
        env:
          PYTHONPATH: ${{ github.workspace }}
          GOOGLE_SHEETS_URL: ${{ secrets.GOOGLE_SHEETS_URL }}
          GOOGLE_SHEETS_TOKEN: ${{ secrets.GOOGLE_SHEETS_TOKEN }}
          ML_MIN_ROWS: "60"
          ML_MIN_TOP3: "5"
        run: python ml/train_model.py

      - name: Entraîner le modèle de potentiel restant
        env:
          PYTHONPATH: ${{ github.workspace }}
          GOOGLE_SHEETS_URL: ${{ secrets.GOOGLE_SHEETS_URL }}
          GOOGLE_SHEETS_TOKEN: ${{ secrets.GOOGLE_SHEETS_TOKEN }}
          ML_MIN_REMAINING_ROWS: "60"
          ML_MIN_REMAINING_CLASS: "5"
          ML_REMAINING_POTENTIAL_THRESHOLD: "1.0"
        run: python ml/train_remaining_potential.py

      - name: Publier les modèles et rapports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: modeles-ml-${{ github.run_number }}
          path: |
            data/ml/top3_model.joblib
            data/ml/metrics.json
            data/ml/dataset.csv
            data/ml/remaining_potential_model.joblib
            data/ml/remaining_potential_metrics.json
            data/ml/remaining_potential_dataset.csv
          if-no-files-found: error
          retention-days: 90
