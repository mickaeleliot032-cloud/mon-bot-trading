name: Agent de trading V4

on:
  workflow_dispatch:
  pull_request:
  schedule:
    # Décalage de 2 minutes pour éviter les pics de charge GitHub aux minutes rondes.
    - cron: "2-59/5 9-17 * * 1-5"
      timezone: "Europe/Paris"

permissions:
  contents: read

concurrency:
  group: trading-agent-v4
  cancel-in-progress: false

jobs:
  validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances de validation
        run: pip install --requirement requirements-dev.txt

      - name: Vérifier le code
        run: |
          ruff check .
          pytest -q

  paper-trading:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restaurer l'état du paper trading
        uses: actions/cache/restore@v4
        with:
          path: data
          key: trading-state-v4-${{ github.run_id }}
          restore-keys: |
            trading-state-v4-

      - name: Installer les dépendances
        run: pip install --requirement requirements.txt

      - name: Exécuter le passage planifié
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mon_bot.py --scheduled

      - name: Sauvegarder l'état du paper trading
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: trading-state-v4-${{ github.run_id }}
